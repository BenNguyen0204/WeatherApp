<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter city name" spellcheck="false">
            <button class="searchBtn"><img src="img/search.svg" alt="search button"></button>
        </div>
    
        <div class="weather">
            <div class="overview">
                <img src="img/rain.png" class="weather-icon" alt="weatherIcon">
                <h1 class="temp">22°C</h1>
                <h2 class="city">New York</h2>
            </div>
                
            <div class="details">
                <p class="humidity">Humidity: 88%</p>
                <p class="h3 precipation">Precipitation: 0%</p>
                <p class="wind">Wind: 3 km/h</p>
            </div>
        </div>
    </div>
</body>
</html>
